<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Reposición</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="misScripts.js"></script>
</head>

<body>

    <h1>Recomendador de Actividades</h1>

    <label for="presupuesto">Presupuesto:</label>
    <input type="number" id="presupuesto">

    <label for="personas">Numero de personas:</label>
    <input type="number" id="personas">

    <label for="categoria">Categoría:</label>
    <select id="categoria">
        <option value="Deportes">Deportes</option>
        <option value="Entretenimiento">Entretenimiento</option>
        <option value="Turismo">Turismo</option>
        <option value="Actividades familiares">Actividades familiares</option>
    </select>

    <br>
    <button onclick="Recomendacion()">Recomendacion</button>
    <button onclick="limpiarFormulario()">Limpiar</button>

    <div id="resultado"></div>

</body>

</html>
