<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PracticaWhile2</title>
</head>
<body>
    <script>
    let numeroUser = parseInt(prompt("Introduce un número inicial:"));

function testLoop(numero) {
    while (numero <= 10) {
        console.log(numero);
        numero++;
    }
}

testLoop(numeroUser);

</script>
