<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PracticaWhile1</title>
</head>
<body>
    <script>
    let vueltasUser = parseInt(prompt("Introduce el número de vueltas que deseas dar:"));
    
function vueltas(Vueltas) {
    let contador = 1;

    while (contador <= Vueltas) {
        console.log("Vuelta numero: " + contador);
        contador++;
    }
}

vueltas(vueltasUser);
</script>
</body>
</html>
